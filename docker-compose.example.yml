services:
  gluey-proxy:
    build: .
    image: gluey-proxy:local
    container_name: gluey-proxy
    environment:
      UPSTREAM: http://litellm:4000
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY}
      LOG_REQUESTS: ${LOG_REQUESTS:-1}
      LOG_BODY_TO_STDOUT: ${LOG_BODY_TO_STDOUT:-1}
      LOG_BODY_MAX_CHARS: ${LOG_BODY_MAX_CHARS:-20000}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      CLAUDE_SEARCH_BACKEND: ollama
      CODEX_SEARCH_BACKEND: ollama
      SEARCH_AUTO_ORDER: ${SEARCH_AUTO_ORDER:-ollama,tavily,searxng}
      INJECT_WEBSEARCH: ${INJECT_WEBSEARCH:-0}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
    ports:
      - "127.0.0.1:4001:4001"
    restart: unless-stopped

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    image: gluey-proxy-docs:local
    container_name: gluey-proxy-docs
    ports:
      - "127.0.0.1:4002:80"
    restart: unless-stopped
