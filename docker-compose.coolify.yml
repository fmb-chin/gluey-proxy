# documentation: https://github.com/fmb-chin/gluey-proxy
# slogan: Compatibility proxy for Claude Code and Codex web search workflows.
# category: ai
# tags: ai, proxy, codex, claude, web-search
# port: 4001
# minversion: 4.0.0-beta.411

services:
  gluey-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_URL_GLUEY-PROXY_4001
      - UPSTREAM=${UPSTREAM:?Set the upstream OpenAI/Anthropic-compatible base URL}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - LOG_REQUESTS=${LOG_REQUESTS:-1}
      - LOG_BODY_TO_STDOUT=${LOG_BODY_TO_STDOUT:-1}
      - LOG_BODY_MAX_CHARS=${LOG_BODY_MAX_CHARS:-20000}
      - CLAUDE_SEARCH_BACKEND=${CLAUDE_SEARCH_BACKEND:-ollama}
      - CODEX_SEARCH_BACKEND=${CODEX_SEARCH_BACKEND:-ollama}
      - SEARCH_AUTO_ORDER=${SEARCH_AUTO_ORDER:-ollama,tavily,searxng}
      - INJECT_WEBSEARCH=${INJECT_WEBSEARCH:-0}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-}
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-5}
      - SEARCH_SNIPPET_LEN=${SEARCH_SNIPPET_LEN:-1500}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/docs', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  docs:
    image: nginx:alpine
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    environment:
      - SERVICE_URL_DOCS_80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
